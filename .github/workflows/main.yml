name: Main

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  qt_version:    &qt_version 6.11.1

# This job just publishes the latest Doxygen documentation to GitHub pages.
# Building and releasing the application is done in the check_and_build (merge queue)
# and release workflow
jobs:

  build_doxygen:
    uses: ./.github/workflows/reusable_doxygen.yml
    with:
      upload_doxygen: true
      qt_version: *qt_version

  publish_doxygen:
    needs: build_doxygen
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      pages: write
    environment: github-pages

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: doxygen
          path: docs/html/

      - name: Upload doxygen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/html/

      - name: Publish doxygen
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
